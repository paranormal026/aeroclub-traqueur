name: Build traqueur.exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'traqueur.py'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller requests SimConnect

      - name: Replace SimConnect.dll with the MSFS 2024 SDK version
        shell: pwsh
        run: |
          $pkgDir = python -c "import SimConnect, os; print(os.path.dirname(SimConnect.__file__))"
          Copy-Item "SimConnect.dll" "$pkgDir\SimConnect.dll" -Force

      - name: Build exe
        run: pyinstaller --onefile --name traqueur --add-binary "SimConnect.dll;SimConnect" traqueur.py

      - uses: actions/upload-artifact@v4
        with:
          name: traqueur-exe
          path: dist/traqueur.exe
