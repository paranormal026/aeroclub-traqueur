name: Build traqueur.exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'traqueur.py'
      - 'acm_*.py'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller requests SimConnect

      - name: Replace SimConnect.dll with the MSFS 2024 SDK version
        shell: pwsh
        run: |
          $pkgDir = python -c "import SimConnect, os; print(os.path.dirname(SimConnect.__file__))"
          Copy-Item "SimConnect.dll" "$pkgDir\SimConnect.dll" -Force

      - name: Tests v18
        run: python tests/test_v18.py

      - name: Tests v19 (dossier MSFS en jonction chiffree, lancement_auto_ignore, delais du veilleur)
        run: python tests/test_v19.py

      - name: Build veilleur
        run: pyinstaller --onefile --noconsole --name acm_veilleur --icon installateur/acm.ico --add-data "voix_veilleur;voix_veilleur" --add-binary "SimConnect.dll;." acm_veilleur.py

      - name: Build exe
        run: pyinstaller --onefile --name traqueur --icon installateur/acm.ico --add-binary "SimConnect.dll;SimConnect" --add-data "dist/acm_veilleur.exe;." traqueur.py

      - uses: actions/upload-artifact@v4
        with:
          name: traqueur-exe
          path: |
            dist/traqueur.exe
            dist/acm_veilleur.exe
