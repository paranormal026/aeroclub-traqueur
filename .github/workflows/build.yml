name: Build traqueur.exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'traqueur.py'
      - 'acm_*.py'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller requests SimConnect truststore

      - name: Replace SimConnect.dll with the MSFS 2024 SDK version
        shell: pwsh
        run: |
          $pkgDir = python -c "import SimConnect, os; print(os.path.dirname(SimConnect.__file__))"
          Copy-Item "SimConnect.dll" "$pkgDir\SimConnect.dll" -Force

      - name: Tests v18
        run: python tests/test_v18.py

      - name: Tests v19 (dossier MSFS en jonction chiffree, lancement_auto_ignore, delais du veilleur)
        run: python tests/test_v19.py

      - name: Tests v20 (carburant des missions, reservoirs regles au depart, ravitaillement en vol, textes de la console)
        run: python tests/test_v20.py

      - name: Tests v21 (aucun paquet ni programme remplace pendant que le simulateur tourne, mise a jour en attente)
        run: python tests/test_v21.py

      - name: Tests v22 (tablette jamais oubliee - jonction non traversable, simulateur qui se ferme, connexion bloquee, nouveaux essais)
        run: python tests/test_v22.py

      - name: Tests v23 (commandes de tir - commandes de la fenetre gardees dans config.json, --commandes, raccourci du bureau, touche C)
        run: python tests/test_v23.py

      - name: Tests v24 (mise a jour des services au sol - nos programmes fermes simulateur ferme, raison toujours donnee, maj_sol_en_attente.txt)
        run: python tests/test_v24.py

      - name: Tests v25 (fichiers temporaires effaces - certificats hors de TEMP, magasin Windows, auto-reparation, dossier runtime)
        run: python tests/test_v25.py

      - name: Tests v26 (reservoirs refuses par l'appareil - EF2000 - ecartes, plein et pourcentages des reservoirs qui acceptent, livres reellement recues, aucune perte)
        run: python tests/test_v26.py

      - name: Tests v27 (reservoir cache de l'EF2000 - carburant reellement recu mesure sur FUEL TOTAL QUANTITY, aucune livraison de trop)
        run: python tests/test_v27.py

      - name: Build veilleur
        run: pyinstaller --onefile --noconsole --runtime-tmpdir "%LOCALAPPDATA%\AeroClubManager\runtime" --name acm_veilleur --icon installateur/acm.ico --add-data "voix_veilleur;voix_veilleur" --add-binary "SimConnect.dll;." acm_veilleur.py

      - name: Build exe
        run: pyinstaller --onefile --runtime-tmpdir "%LOCALAPPDATA%\AeroClubManager\runtime" --name traqueur --icon installateur/acm.ico --add-binary "SimConnect.dll;SimConnect" --add-data "dist/acm_veilleur.exe;." traqueur.py

      - name: v25 - exe decompresses dans %LOCALAPPDATA%\AeroClubManager\runtime, jamais dans TEMP
        shell: pwsh
        run: ./tests/runtime_v25.ps1 -Dist dist

      - uses: actions/upload-artifact@v4
        with:
          name: traqueur-exe
          path: |
            dist/traqueur.exe
            dist/acm_veilleur.exe
