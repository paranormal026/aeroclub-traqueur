name: Build traqueur.exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'traqueur.py'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller requests SimConnect

      - name: Build exe
        run: pyinstaller --onefile --name traqueur traqueur.py

      - uses: actions/upload-artifact@v4
        with:
          name: traqueur-exe
          path: dist/traqueur.exe

